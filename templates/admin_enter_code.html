{% extends "base.html" %}

{% block content %}
<h2>Enter Admin Code</h2>
<p>Enter the one-time code sent to the owner's email.</p>

<form method="POST" action="/admin/enter-code">
    <label for="code">Admin Code</label>
    <input type="text" id="code" name="code" required maxlength="8" placeholder="ABCD1234">
    <button type="submit">Enter Code</button>
</form>

<p><a href="/admin">Back to request</a></p>
{% endblock %}
